<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slider</title>
</head>
<style>

    #container{
        background-color: aquamarine;
        padding: 10% 15%;
        height: 300px;
        position: relative;
    }

    .item{
        background-color: bisque;
        height: 100%;
        width: 40%;
        display: none;
        animation: fade 1s;
    }

    #cont{
        height: 100%;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        overflow: hidden;
    }

    button{
        height: 50px;
        width: 50px;
        position: absolute;
    }

    #left{
        left: 10px;
        top: 50%;
    }

    #right{
        right: 10px;
        top: 50%;
    }

    @keyframes fade {
        0%{
            opacity: 0.2;
        }

        100%{
            opacity: 1;
        }
    }
    

</style>
<body>
    <div id="container">
        <div id="cont">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item">5</div>
            <div class="item">6</div>
            <div class="item">7</div>
            <div class="item">8</div>
        </div>
        <button id="left">L</button>
        <button id="right">R</button>
    </div>

    <script src="slider.js"></script>
</body>
</html>
