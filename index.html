<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slider</title>
</head>
<style>

    #container{
        background-color: aquamarine;
        padding: 10% 15%;
        height: 300px;
        position: relative;
    }

    .item{
        background-color: bisque;
        height: 100%;
        width: 40%;
        display: none;
        animation: fade 1s;
    }

    #cont{
        height: 100%;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        overflow: hidden;
    }

    button{
        height: 50px;
        width: 50px;
        position: absolute;
    }

    #left{
        left: 10px;
        top: 50%;
    }

    #right{
        right: 10px;
        top: 50%;
    }

    @keyframes fade {
        0%{
            opacity: 0.2;
        }

        100%{
            opacity: 1;
        }
    }
    

</style>
<body>
    <div id="container">
        <div id="cont">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item">5</div>
            <div class="item">6</div>
            <div class="item">7</div>
            <div class="item">8</div>
        </div>
        <button id="left">L</button>
        <button id="right">R</button>
    </div>

    <script>

        let items = document.getElementsByClassName('item')
        let count = 0
        let left = document.getElementById('left')
        let right = document.getElementById('right')

        if(window.innerWidth < 768){
            for(let i = 0; i < items.length; i++){items[i].style.width='100%'}
            items[count].style.display = 'block'
        }
        else{
            for(let i = 0; i < items.length; i++){items[i].style.width='40%'}
            items[count].style.display = 'block'
            items[count + 1].style.display = 'block'
        }

        window.addEventListener('resize', function(){
            if(window.innerWidth < 768){
                for(let i = 0; i < items.length; i++){items[i].style.width='100%'}
                items[count].style.display = 'block'
                items[count + 1].style.display = 'none'
                if (count==items.length-2){
                    right.style.display = 'block'
                }
            }
            else{
                for(let i = 0; i < items.length; i++){items[i].style.width='40%'}
                if (count==items.length-2){
                    right.style.display = 'none'
                }
                if (count==items.length-1){
                    count--
                    items[count].style.display = 'block'
                    items[count + 1].style.display = 'block'
                }
                else{
                    items[count].style.display = 'block'
                    items[count + 1].style.display = 'block'
                }
            }

        })

        right.addEventListener('click',function(){
                count += 1
                for(let i = 0; i < count; i++){
                    items[i].style.display = 'none'
                }
                for(let i = count + 2; i < items.length; i++){
                    items[i].style.display = 'none'
                }
                if(window.innerWidth < 768){
                    items[count].style.display = 'block'
                    
                    if(count == items.length-1){
                        right.style.display='none'
                    }
                    else{
                        right.style.display='block'
                        left.style.display='block'
                    }
                }
                else{
                    items[count].style.display = 'block'
                    items[count + 1].style.display = 'block'
                    if(count == items.length-2){
                        right.style.display='none'
                    }
                    else{
                        right.style.display='block'
                        left.style.display='block'
                    }
            }})

        left.addEventListener('click',function(){
                count -= 1
                items[count].style.display = 'block'
                items[count + 1].style.display = 'block'
                for(let i = 0; i < count; i++){
                    items[i].style.display = 'none'
                }
                for(let i = count + 2; i < items.length; i++){
                    items[i].style.display = 'none'
                }
                if(count==0){
                    left.style.display='none'
                }
                else{
                    right.style.display='block'
                    left.style.display='block'
                }
            })

        left.style.display='none'

    </script>
</body>
</html>
